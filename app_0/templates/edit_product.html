<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>
</head>
<body>

<h2>Edit Product</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <input type="text"
           name="product_name"
           value="{{ product.product_name }}"
           required>

    <br><br>

    <textarea name="description">{{ product.description }}</textarea>

    <br><br>

    <input type="number"
           step="0.01"
           name="price"
           value="{{ product.price }}"
           required>

    <br><br>

    {% if product.product_image %}
        <img src="{{ product.product_image.url }}"
             width="100">
        <br><br>
    {% endif %}

    <input type="file" name="product_image">

    <br><br>

    <button type="submit">
        Update Product
    </button>

</form>

</body>
</html>
