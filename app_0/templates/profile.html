<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .profile-card {
            width: 350px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        .profile-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #333;
        }

        .profile-card h2 {
            margin-top: 15px;
        }

        .profile-info {
            text-align: left;
            margin-top: 20px;
        }

        .profile-info p {
            font-size: 16px;
            margin: 10px 0;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

    </style>

</head>

<body>

<div class="profile-card">

    {% if user.profile_pic %}
        <img src="{{ user.profile_pic.url }}" alt="Profile Image">
    {% else %}
        <img src="/media/profile/default.png" alt="No Image">
    {% endif %}


    <h2>{{ user.name }}</h2>


    <div class="profile-info">

        <p><b>Email:</b> {{ user.email }}</p>

        <p><b>Age:</b> {{ user.age }}</p>

        <p><b>Phone:</b> {{ user.phone }}</p>

    </div>

<a href="{% url 'edit_profile' %}" class="btn">Edit Profile</a>

</div>


</body>
</html>
