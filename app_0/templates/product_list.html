<!DOCTYPE html>
<html>
<head>
    <title>Product List</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: Inter, sans-serif;
            background:#f6f7fb;
        }

        /* PAGE WRAPPER */
        .container{
            max-width:1200px;
            margin:auto;
            padding:40px 20px;
        }

        /* HEADER */
        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:30px;
        }

        .title{
            font-size:26px;
            font-weight:700;
        }

        .btn-add{
            background:#111;
            color:#fff;
            padding:10px 16px;
            border-radius:12px;
            text-decoration:none;
            transition:.3s;
        }

        .btn-add:hover{
            background:#333;
        }

        /* GRID (HORIZONTAL ORDER - CLEAN ROWS) */
        .grid{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:20px;
        }

        @media(max-width:1100px){
            .grid{ grid-template-columns:repeat(3,1fr); }
        }

        @media(max-width:800px){
            .grid{ grid-template-columns:repeat(2,1fr); }
        }

        @media(max-width:500px){
            .grid{ grid-template-columns:1fr; }
        }

        /* CARD */
        .card{
            background:#fff;
            border-radius:16px;
            overflow:hidden;
            box-shadow:0 8px 20px rgba(0,0,0,0.06);
            transition:.25s ease;
            display:flex;
            flex-direction:column;
        }

        .card:hover{
            transform:translateY(-4px);
            box-shadow:0 14px 35px rgba(0,0,0,0.12);
        }

        /* IMAGE FIX */
        .img-wrapper{
            width:100%;
            height:220px;
            overflow:hidden;
            background:#eee;
        }

        .img-wrapper img{
            width:100%;
            height:100%;
            object-fit:cover;
            transition:transform .4s ease;
        }

        .card:hover img{
            transform:scale(1.05);
        }

        /* CONTENT */
        .content{
            padding:14px;
            display:flex;
            flex-direction:column;
            flex-grow:1;
        }

        .name{
            font-size:16px;
            font-weight:600;
        }

        .desc{
            font-size:13px;
            color:#666;
            margin-top:6px;
            line-height:1.4;
            height:38px;
            overflow:hidden;
        }

        /* BOTTOM ROW */
        .bottom{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-top:auto;
            padding-top:12px;
        }

        .price{
            font-weight:700;
            font-size:15px;
        }

        .btn{
            background:#111;
            color:#fff;
            padding:8px 12px;
            border-radius:10px;
            font-size:13px;
            text-decoration:none;
            transition:.3s;
        }

        .btn:hover{
            background:#333;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="title">Product List</div>

        <a href="{% url 'add_product' %}" class="btn-add">
            + Add Product
        </a>
    </div>

    {% if products %}

    <div class="grid">

        {% for product in products %}

        <div class="card">

            <!-- IMAGE -->
            <div class="img-wrapper">
                {% if product.product_image %}
                    <img src="{{ product.product_image.url }}">
                {% endif %}
            </div>

            <!-- CONTENT -->
            <div class="content">

                <div class="name">
                    {{ product.product_name }}
                </div>

                <div class="desc">
                    {{ product.description }}
                </div>

                <div class="bottom">

                    <div class="price">
                        ₹{{ product.price }}
                    </div>

                    <a href="{% url 'add_to_cart' product.id %}" class="btn">
                        Add
                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

    {% else %}

    <p style="text-align:center;color:#777;">
        No products available.
    </p>

    {% endif %}

</div>

</body>
</html>
