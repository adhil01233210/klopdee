<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: Inter, sans-serif;
            background:#f6f7fb;
        }

        .container{
            max-width:600px;
            margin:auto;
            padding:60px 20px;
        }

        .card{
            background:#fff;
            border-radius:18px;
            box-shadow:0 10px 30px rgba(0,0,0,0.08);
            padding:30px;
        }

        .title{
            font-size:24px;
            font-weight:700;
            margin-bottom:20px;
        }

        label{
            font-size:13px;
            font-weight:500;
            color:#444;
        }

        input, textarea{
            width:100%;
            margin-top:6px;
            margin-bottom:18px;
            padding:12px;
            border-radius:12px;
            border:1px solid #ddd;
            outline:none;
            font-size:14px;
            transition:.3s;
            background:#fff;
        }

        input:focus, textarea:focus{
            border-color:#111;
            box-shadow:0 0 0 3px rgba(0,0,0,0.05);
        }

        textarea{
            resize:none;
        }

        .btn{
            width:100%;
            padding:12px;
            border-radius:12px;
            background:#111;
            color:#fff;
            font-weight:600;
            border:none;
            cursor:pointer;
            transition:.3s;
        }

        .btn:hover{
            background:#333;
        }

        .back{
            display:inline-block;
            margin-bottom:20px;
            color:#555;
            text-decoration:none;
            font-size:14px;
        }

        .back:hover{
            color:#111;
        }

    </style>
</head>

<body>

<div class="container">

    <a href="/product-list/" class="back">← Back to Products</a>

    <div class="card">

        <div class="title">Add New Product</div>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <label>Product Name</label>
            <input type="text" name="product_name" required>

            <label>Description</label>
            <textarea name="description" rows="4" required></textarea>

            <label>Price</label>
            <input type="number" step="0.01" name="price" required>

            <label>Stock</label>
            <input type="number" name="stock" required>

          <label class="block text-sm font-medium text-gray-700 mb-2">
    Product Image
</label>

<div class="relative border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-gray-500 transition">

    <input
        type="file"
        name="product_image"
        class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
    >

    <div class="space-y-2">
        <div class="text-3xl">📁</div>

        <p class="text-gray-700 font-medium">
            Drag & Drop or Click to Upload
        </p>

        <p class="text-xs text-gray-500">
            PNG, JPG up to 10MB
        </p>
    </div>

</div>

            <button type="submit" class="btn">
                Add Product
            </button>

        </form>

    </div>

</div>

</body>
</html>
