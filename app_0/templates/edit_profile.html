<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
        }

        .edit-box {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
        }

    </style>

</head>

<body>


<div class="edit-box">

    <h2>Edit Profile</h2>


    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}


        <label>Name</label>
        <input type="text" name="name" value="{{ user.name }}">


        <label>Email</label>
        <input type="email" name="email" value="{{ user.email }}">


        <label>Age</label>
        <input type="number" name="age" value="{{ user.age }}">


        <label>Phone</label>
        <input type="text" name="phone" value="{{ user.phone }}">


        <label>Profile Picture</label>
        <input type="file" name="profile_pic">


        <button type="submit">
            Update Profile
        </button>


    </form>


</div>


</body>
</html>
