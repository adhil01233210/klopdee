<!DOCTYPE html>
<html>
<head>
    <title>My Products</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: Inter, sans-serif;
            background:#f6f7fb;
        }

        .container{
            max-width:1200px;
            margin:auto;
            padding:40px 20px;
        }

        /* HEADER */
        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:30px;
        }

        .title{
            font-size:26px;
            font-weight:700;
        }

        .btn-add{
            background:#111;
            color:#fff;
            padding:10px 16px;
            border-radius:12px;
            text-decoration:none;
            transition:.3s;
        }

        .btn-add:hover{
            background:#333;
        }

        /* GRID */
        .grid{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:20px;
        }

        @media(max-width:900px){
            .grid{ grid-template-columns:repeat(2,1fr); }
        }

        @media(max-width:600px){
            .grid{ grid-template-columns:1fr; }
        }

        /* CARD */
        .card{
            background:#fff;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 10px 25px rgba(0,0,0,0.06);
            transition:.3s;
            display:flex;
            flex-direction:column;
        }

        .card:hover{
            transform:translateY(-5px);
            box-shadow:0 18px 40px rgba(0,0,0,0.10);
        }

        .img{
            width:100%;
            height:200px;
            object-fit:cover;
        }

        .content{
            padding:14px;
            display:flex;
            flex-direction:column;
            gap:8px;
        }

        .name{
            font-size:16px;
            font-weight:600;
        }

        .desc{
            font-size:13px;
            color:#666;
            height:36px;
            overflow:hidden;
        }

        .price{
            font-weight:700;
            font-size:15px;
        }

        /* ACTIONS */
        .actions{
            display:flex;
            justify-content:space-between;
            margin-top:10px;
        }

        .edit{
            color:#2563eb;
            font-size:14px;
            text-decoration:none;
        }

        .delete{
            color:#ef4444;
            font-size:14px;
            text-decoration:none;
        }

        .delete:hover,
        .edit:hover{
            text-decoration:underline;
        }

        /* EMPTY */
        .empty{
            text-align:center;
            color:#777;
            margin-top:40px;
        }

    </style>
</head>

<body>



    {% else %}

        <div class="empty">
            <h3>No products added yet.</h3>
        </div>

    {% endif %}

</div>

</body>
</html>
